<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Discover Braga in 3 Days</title>

  <!-- LineIcons for download icon -->
  <link rel="stylesheet" href="https://cdn.lineicons.com/4.0/lineicons.css">

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", sans-serif;
      background: url('https://imagenes.20minutos.es/uploads/imagenes/2023/05/17/arco-da-porta-nova-braga-istock-1423662680.jpeg') no-repeat center center fixed;
      background-size: cover;
      color: white;
    }

    .overlay {
      background-color: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      animation: fadeIn 1s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .container {
      max-width: 500px;
      padding: 30px 20px;
      border-radius: 20px;
      text-align: center;
      animation: fadeIn 1s ease-in-out;
    }

    .lang-buttons {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 25px;
    }

    .lang-buttons img {
      width: 32px;
      height: auto;
      cursor: pointer;
      transition: transform 0.2s;
      border-radius: 5px;
    }

    .lang-buttons img:hover {
      transform: scale(1.1);
    }

    h1 {
      margin-bottom: 10px;
      font-size: 2em;
      animation: fadeIn 1s ease-in-out;
    }

    p {
      margin-bottom: 30px;
      font-size: 1.1em;
      animation: fadeIn 1s ease-in-out;
    }

    .download-buttons {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      margin-bottom: 30px;
    }

    .link-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px 20px;
      width: 100%;
      max-width: 300px;
      border: none;
      border-radius: 30px;
      background-color: #2575fc;
      color: white;
      font-size: 1em;
      font-weight: bold;
      text-decoration: none;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
      transition: transform 0.2s, background-color 0.3s, box-shadow 0.3s;
    }

    .link-button:hover {
      background-color: #1a5bbf;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    }

    .link-button i {
      font-size: 18px;
    }

    .footer {
      margin-top: 40px;
      font-size: 0.9em;
      color: #ccc;
      animation: fadeIn 1s ease-in-out;
    }

    @media (max-width: 600px) {
      .container {
        padding: 20px 10px;
      }

      h1 {
        font-size: 1.5em;
      }

      p {
        font-size: 1em;
      }

      .link-button {
        font-size: 0.95em;
      }
    }
  </style>
</head>
<body>
  <div class="overlay">
    <div class="container">
      <div class="lang-buttons">
        <img src="https://flagcdn.com/w40/pt.png" alt="Português" onclick="setLanguage('pt')" title="Português" aria-label="Selecionar idioma Português" />
        <img src="https://flagcdn.com/w40/es.png" alt="Español" onclick="setLanguage('es')" title="Español" aria-label="Seleccionar idioma Español" />
        <img src="https://flagcdn.com/w40/gb.png" alt="English" onclick="setLanguage('en')" title="English" aria-label="Select English language" />
      </div>

      <h1 id="title">Discover Braga in 3 Days</h1>
      <p id="description">Download the tourist guide in your language:</p>

      <div class="download-buttons">
        <a id="btn-pt" class="link-button" href="https://raw.githubusercontent.com/Bragatur/roteiros/main/CMB-Roteir-Descobrir-Braga-em-tre-s-Dias-Versao-Digital-WEB-PORTUGUES.pdf" target="_blank">
          <i class="lni lni-download"></i> Português
        </a>

        <a id="btn-es" class="link-button" href="https://raw.githubusercontent.com/Bragatur/roteiros/main/CMB-Roteir-Descobrir-Braga-em-tre-s-Dias-Versao-Digital-WEB-ESPANHOL.pdf" target="_blank">
          <i class="lni lni-download"></i> Español
        </a>

        <a id="btn-en" class="link-button" href="https://raw.githubusercontent.com/Bragatur/roteiros/main/CMB-Roteir-Descobrir-Braga-em-tre-s-Dias-Versao-Digital-WEB-INGLES.pdf" target="_blank">
          <i class="lni lni-download"></i> English
        </a>
      </div>

      <div class="footer">
        © Município de Braga
      </div>
    </div>
  </div>

  <script>
    const texts = {
      pt: {
        title: "Descobrir Braga em 3 Dias",
        description: "Descarrega o roteiro turístico no teu idioma:"
      },
      es: {
        title: "Descubrir Braga en 3 Días",
        description: "Descarga la guía turística en tu idioma:"
      },
      en: {
        title: "Discover Braga in 3 Days",
        description: "Download the tourist guide in your language:"
      }
    };

    function setLanguage(lang) {
      document.getElementById("title").innerText = texts[lang].title;
      document.getElementById("description").innerText = texts[lang].description;
      document.documentElement.lang = lang;
      document.title = texts[lang].title;

      // Esconde todos os botões
      document.getElementById("btn-pt").style.display = "none";
      document.getElementById("btn-es").style.display = "none";
      document.getElementById("btn-en").style.display = "none";

      // Mostra apenas o botão da língua selecionada
      const selectedButton = document.getElementById(`btn-${lang}`);
      if (selectedButton) {
        selectedButton.style.display = "flex";
      }
    }

    // Deteta idioma do navegador e aplica, com fallback para inglês
    const supportedLanguages = ["pt", "es", "en"];
    let browserLang = navigator.language.slice(0, 2);
    if (!supportedLanguages.includes(browserLang)) {
      browserLang = "en";
    }

    setLanguage(browserLang);
  </script>
</body>
</html>
