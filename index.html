<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Descobrir Braga em 3 Dias</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", sans-serif;
      background: url('https://imagenes.20minutos.es/uploads/imagenes/2023/05/17/arco-da-porta-nova-braga-istock-1423662680.jpeg') no-repeat center center fixed;
      background-size: cover;
      color: white;
    }

    .overlay {
      background-color: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      padding: 30px 20px;
      border-radius: 20px;
      text-align: center;
    }

    .lang-buttons {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 25px;
    }

    .lang-buttons img {
      width: 32px;
      height: auto;
      cursor: pointer;
      transition: transform 0.2s;
      border-radius: 5px;
    }

    .lang-buttons img:hover {
      transform: scale(1.1);
    }

    h1 {
      margin-bottom: 10px;
      font-size: 2em;
    }

    p {
      margin-bottom: 30px;
      font-size: 1.1em;
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 15px;
      align-items: center;
    }

    .link-button {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px 12px;
      width: 70%;
      border: none;
      border-radius: 30px;
      background-color: white;
      color: #2575fc;
      font-size: 0.95em;
      font-weight: bold;
      text-decoration: none;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
      transition: transform 0.2s, background-color 0.3s;
      touch-action: manipulation;
      min-height: 40px;
    }

    .link-button img.flag-icon {
      width: 24px;
      height: auto;
      margin-right: 10px;
      border-radius: 3px;
    }

    .link-button:hover {
      background-color: #e0e0e0;
      transform: scale(1.05);
    }

    .footer {
      margin-top: 40px;
      font-size: 0.9em;
      color: #ccc;
    }

    @media (max-width: 600px) {
      .container {
        padding: 20px 10px;
      }

      h1 {
        font-size: 1.5em;
      }

      p {
        font-size: 1em;
      }

      .link-button {
        width: 100%;
        font-size: 0.9em;
        padding: 10px 12px;
      }
    }
  </style>
</head>
<body>
  <div class="overlay">
    <div class="container">
      <div class="lang-buttons">
        <img src="https://flagcdn.com/w40/pt.png" alt="Português" onclick="setLanguage('pt')" title="Português" />
        <img src="https://flagcdn.com/w40/es.png" alt="Español" onclick="setLanguage('es')" title="Español" />
        <img src="https://flagcdn.com/w40/gb.png" alt="English" onclick="setLanguage('en')" title="English" />
      </div>

      <h1 id="title">Descobrir Braga em 3 Dias</h1>
      <p id="description">Descarrega o roteiro turístico no teu idioma:</p>

      <div class="button-group">
        <a class="link-button" href="https://raw.githubusercontent.com/Bragatur/roteiros/main/CMB-Roteir-Descobrir-Braga-em-tre-s-Dias-Versao-Digital-WEB-PORTUGUES.pdf" target="_blank">
          <img src="https://flagcdn.com/w40/pt.png" alt="Português" class="flag-icon" />
          <span id="portuguese">Português</span>
        </a>

        <a class="link-button" href="https://raw.githubusercontent.com/Bragatur/roteiros/main/CMB-Roteir-Descobrir-Braga-em-tre-s-Dias-Versao-Digital-WEB-ESPANHOL.pdf" target="_blank">
          <img src="https://flagcdn.com/w40/es.png" alt="Español" class="flag-icon" />
          <span id="spanish">Espanhol</span>
        </a>

        <a class="link-button" href="https://raw.githubusercontent.com/Bragatur/roteiros/main/CMB-Roteir-Descobrir-Braga-em-tre-s-Dias-Versao-Digital-WEB-INGLES.pdf" target="_blank">
          <img src="https://flagcdn.com/w40/gb.png" alt="English" class="flag-icon" />
          <span id="english">Inglês</span>
        </a>
      </div>

      <div class="footer">
        © Município de Braga
      </div>
    </div>
  </div>

  <script>
    const texts = {
      pt: {
        title: "Descobrir Braga em 3 Dias",
        description: "Descarrega o roteiro turístico no teu idioma:",
        portuguese: "Português",
        spanish: "Espanhol",
        english: "Inglês"
      },
      es: {
        title: "Descubrir Braga en 3 Días",
        description: "Descarga la guía turística en tu idioma:",
        portuguese: "Portugués",
        spanish: "Español",
        english: "Inglés"
      },
      en: {
        title: "Discover Braga in 3 Days",
        description: "Download the tourist guide in your language:",
        portuguese: "Portuguese",
        spanish: "Spanish",
        english: "English"
      }
    };

    function setLanguage(lang) {
      const content = texts[lang];
      document.getElementById("title").innerText = content.title;
      document.getElementById("description").innerText = content.description;
      document.getElementById("portuguese").innerText = content.portuguese;
      document.getElementById("spanish").innerText = content.spanish;
      document.getElementById("english").innerText = content.english;
      document.documentElement.lang = lang;
      document.title = content.title;
    }
  </script>
</body>
</html>
